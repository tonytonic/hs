name: Vérification

# Déclenchement MANUEL : depuis l'app GitHub sur iPhone,
#   onglet Actions → « Vérification » → bouton « Run workflow ».
# Le rapport s'affiche directement dans le résumé du run, lisible sur mobile.
# Les contrôles ne font que lire et rapporter. UNE SEULE étape écrit :
# « 1.5 — Mise à jour des fichiers de suivi », qui régénère
# GrillePaye/suivi-public.json et GrillePaye/tracking-ccn.csv à partir de
# ccn-data.json et les committe sur la branche de production, seulement si
# leur contenu a réellement changé (la date seule ne compte pas).
on:
  # Veille hebdomadaire, le mercredi à 7h UTC. L'aspirateur tourne lundi et
  # jeudi : le mercredi tombe donc après que le run du lundi a été commité,
  # et avant celui du jeudi.
  #
  # Minute décalée à :07, pas :00 -- GitHub le documente lui-même : la charge
  # est la plus forte pile à l'heure ronde, et un run programmé peut être
  # abandonné en silence si la charge est trop élevée, sans email ni trace.
  # Même correctif appliqué le 27/07/2026 sur aspirateur.yml (droit) et
  # regenerer.yml (veille-perso), suite à un run d'aspirateur silencieusement
  # sauté un lundi. Best-effort côté GitHub, aucune garantie à 100%, mais
  # évite le pic de contention dans l'écrasante majorité des cas.
  schedule:
    - cron: "7 7 * * 3"
  workflow_dispatch:
    inputs:
      branche:
        description: "Branche contenant les fichiers de production."
        required: false
        default: "Android-cloudfare-production"
      depot_droit:
        # Compte DIFFÉRENT de celui de l'application (tonytonic/hs) : le fonds
        # est hébergé sous un autre compte, anthonychauvel.
        description: "Dépôt du fonds (pour détecter les liens morts et la veille)."
        required: false
        default: "anthonychauvel/droit"

# issues: write  → ouvrir un ticket quand la veille trouve quelque chose.
# contents: write → committer les fichiers de suivi régénérés (étape 1.5).
permissions:
  contents: write
  issues: write

jobs:
  verifier:
    runs-on: ubuntu-latest
    steps:
      # ATTENTION — les fichiers de production ne sont PAS sur la branche par
      # défaut mais sur « Android-cloudfare-production ». Sans ce « ref », le
      # workflow vérifierait les fichiers de main et annoncerait des résultats
      # qui ne correspondent à rien de déployé.
      #
      # Le workflow lui-même doit en revanche RESTER sur la branche par défaut :
      # GitHub ne déclenche les exécutions planifiées que depuis celle-ci. Un
      # « schedule » posé sur la branche de production ne se lancerait jamais.
      - name: Récupérer l'application (branche de production)
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.branche || 'Android-cloudfare-production' }}

      # idcc_list.txt et output/ccn/ vivent dans l'AUTRE dépôt. Deux choses
      # peuvent empêcher de le lire, et le message d'erreur de checkout ne
      # distingue pas les deux :
      #   · le nom du dépôt est faux ;
      #   · le dépôt est PRIVÉ — et c'est le cas le plus fréquent. Le jeton
      #     fourni automatiquement par GitHub (GITHUB_TOKEN) n'a accès QU'AU
      #     dépôt courant. Lire un second dépôt privé exige un jeton explicite.
      # Le fonds (anthonychauvel/droit) est public, sur un compte DIFFÉRENT de
      # celui de l'application (tonytonic/hs) : aucun jeton n'est nécessaire
      # pour le lire. token/TOKEN_DROIT est conservé en repli seulement — utile
      # si le dépôt passait un jour en privé, sans effet sur un dépôt public.
      - name: Récupérer le fonds (pour les liens morts et la veille)
        id: fonds
        continue-on-error: true
        uses: actions/checkout@v4
        with:
          repository: ${{ github.event.inputs.depot_droit || 'anthonychauvel/droit' }}
          path: _droit
          token: ${{ secrets.TOKEN_DROIT || github.token }}

      # Sur un dépôt public, un échec ici n'est presque jamais un problème de
      # permission : c'est le nom du dépôt (mauvais compte, faute de frappe)
      # ou une panne passagère de GitHub.
      - name: Diagnostic d'accès au fonds
        if: steps.fonds.outcome != 'success'
        run: |
          echo "## ⚠️ Le dépôt du fonds n'a pas pu être lu" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "Dépôt visé : \`${{ github.event.inputs.depot_droit || 'anthonychauvel/droit' }}\`" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "Ce dépôt est public : ce n'est presque jamais un problème de permission." >> $GITHUB_STEP_SUMMARY
          echo "À vérifier dans l'ordre :" >> $GITHUB_STEP_SUMMARY
          echo "1. Le nom ci-dessus est-il exact — bon **compte** (\`anthonychauvel\`, pas \`tonytonic\`) et bon dépôt ?" >> $GITHUB_STEP_SUMMARY
          echo "2. Le dépôt est-il toujours public (pas passé en privé entre-temps) ?" >> $GITHUB_STEP_SUMMARY
          echo "3. [state.github.com](https://www.githubstatus.com) signale-t-il une panne en cours ?" >> $GITHUB_STEP_SUMMARY
          if [ -n "${{ secrets.TOKEN_DROIT }}" ]; then
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "\`TOKEN_DROIT\` est défini : vérifier qu'il n'a pas expiré." >> $GITHUB_STEP_SUMMARY
          fi
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "Conséquence : le contrôle des liens morts **et la veille des grilles** sont ignorés." >> $GITHUB_STEP_SUMMARY
          echo "Les autres contrôles restent valables." >> $GITHUB_STEP_SUMMARY

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Installer openpyxl
        run: pip install --quiet openpyxl

      - name: 1.1 — Santé des grilles de salaire
        continue-on-error: true
        run: |
          echo "Branche vérifiée : \`$(git rev-parse --abbrev-ref HEAD)\` — commit \`$(git rev-parse --short HEAD)\`" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "## 1.1 — Santé des grilles" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          if [ -f _droit/idcc_list.txt ]; then
            OPT="--idcc-suivis _droit/idcc_list.txt"
          else
            OPT=""
            echo "> Le dépôt du fonds n'a pas pu être lu : le contrôle des liens morts est ignoré." >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
          fi
          python3 verifier-grilles.py $OPT --out /tmp/g.md
          cat /tmp/g.md >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY

      - name: 1.2 — Cohérence des fichiers CCN
        continue-on-error: true
        run: |
          echo "## 1.2 — Cohérence des fichiers CCN" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          python3 verifier-ccn.py \
            --dares ccn/Dares_Suivi_Historique_convention_collective_Juin2026.xlsx \
            --out /tmp/c.md
          cat /tmp/c.md >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY

      - name: 1.3 — Tableau de suivi
        continue-on-error: true
        run: |
          echo "## 1.3 — Tableau de suivi" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          cd GrillePaye && python3 tracking-ccn.py >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY

      # P1 (21/09/2026) — Avant, 1.3 ne faisait qu'un aperçu et
      # generer-suivi-public.py ne tournait nulle part : suivi-public.json,
      # affiché aux utilisateurs, était resté au 24/07 avec 38 conventions
      # « Non couverte » alors qu'elles avaient une grille.
      #
      # On régénère les deux fichiers, puis on ne committe QUE si leur contenu
      # a changé. suivi-public.json porte la date du jour dans « _genere » :
      # sans la comparaison ci-dessous, on committerait chaque mercredi pour
      # rien (et on redéploierait l'appli pour rien).
      #
      # Le commit est poussé avec le jeton du workflow (GITHUB_TOKEN) : il
      # déclenche le déploiement Cloudflare Pages, mais ne relance aucun autre
      # workflow (règle GitHub, évite les boucles).
      - name: 1.5 — Mise à jour des fichiers de suivi
        continue-on-error: true
        run: |
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "## 1.5 — Fichiers de suivi" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          cd GrillePaye
          cp suivi-public.json /tmp/suivi-avant.json
          python3 generer-suivi-public.py --ecrire > /tmp/suivi.log
          python3 tracking-ccn.py --ecrire > /tmp/tracking.log
          # Seule la date a changé ? On remet l'ancien fichier.
          python3 - <<'PY'
          import json, shutil
          a = json.load(open("/tmp/suivi-avant.json", encoding="utf-8"))
          b = json.load(open("suivi-public.json", encoding="utf-8"))
          a.pop("_genere", None); b.pop("_genere", None)
          if a == b:
              shutil.copy("/tmp/suivi-avant.json", "suivi-public.json")
          PY
          if git diff --quiet -- suivi-public.json tracking-ccn.csv; then
            echo "Rien à mettre à jour : les fichiers de suivi sont déjà à jour ✓" >> $GITHUB_STEP_SUMMARY
            exit 0
          fi
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add suivi-public.json tracking-ccn.csv
          git commit -m "Suivi des grilles régénéré automatiquement ($(date +%d/%m/%Y))"
          git push origin HEAD:${{ github.event.inputs.branche || 'Android-cloudfare-production' }}
          echo "Fichiers de suivi **mis à jour et poussés** sur la branche de production :" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          tail -12 /tmp/suivi.log >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY

      # Veille : le fonds a-t-il des avenants plus récents que nos grilles ?
      # Rapport indicatif seulement (voir 1.6 pour le ticket).
      - name: 1.4 — Veille des grilles (rapport indicatif)
        continue-on-error: true
        run: |
          echo "" >> $GITHUB_STEP_SUMMARY
          if [ -d _droit/output/ccn ]; then
            python3 verifier-fraicheur.py --fonds _droit/output/ccn --out /tmp/v.md
            cat /tmp/v.md >> $GITHUB_STEP_SUMMARY
            # P2 (21/09/2026) : ce rapport reste à titre d'information, mais ne
            # déclenche plus le ticket. Il compare seulement des dates et ne
            # connaît pas exceptions.json : il signalait chaque semaine des
            # grilles déjà passées en revue. Le ticket suit désormais le tableau
            # de bord (étape 1.6).
          else
            echo "## Veille des grilles" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "> Le dossier \`output/ccn\` du fonds n'est pas accessible : veille ignorée." >> $GITHUB_STEP_SUMMARY
          fi

      # P2 (21/09/2026) — Le ticket « veille-grilles » suit le TABLEAU DE BORD.
      # Le tableau de bord date les grilles par arrivée au fonds, contrôle les
      # montants et applique exceptions.json : ses alertes « grilles » sont
      # déjà triées. On ne signale que les alertes JAMAIS VUES par ce ticket :
      # la liste des alertes déjà signalées est gardée, invisible, dans le
      # corps du dernier ticket (commentaire HTML « vus »). Premier run (aucun
      # ticket précédent) : seules les alertes marquées « nouveau » par le
      # tableau de bord comptent, pour ne pas ressortir tout l'historique.
      - name: Récupérer le tableau de bord (donnees.json)
        id: tdb
        continue-on-error: true
        uses: actions/checkout@v4
        with:
          repository: anthonychauvel/tableaudebord
          path: _tdb
          sparse-checkout: donnees.json
          sparse-checkout-cone-mode: false

      - name: 1.6 — Veille des grilles (tableau de bord)
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "## 1.6 — Veille des grilles (tableau de bord)" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          if [ ! -f _tdb/donnees.json ]; then
            echo "> donnees.json du tableau de bord illisible : veille ignorée cette semaine." >> $GITHUB_STEP_SUMMARY
            exit 0
          fi
          gh issue list --label veille-grilles --state all --limit 1 \
             --json body --jq '.[0].body // ""' > /tmp/ancien.md 2>/dev/null || : > /tmp/ancien.md
          python3 - <<'PY'
          import json, re, os, base64, hashlib
          d = json.load(open("_tdb/donnees.json", encoding="utf-8"))
          # Alertes = objets qui ont un « titre » ; on garde celles de la section
          # grilles (clé « grilles » dans le chemin, ou catégorie qui parle de grille).
          alertes = []
          def marche(o, chemin):
              if isinstance(o, dict):
                  if "titre" in o and ("grilles" in chemin or "grille" in str(o.get("categorie", "")).lower()):
                      alertes.append(o); return
                  for k, v in o.items(): marche(v, chemin + [str(k)])
              elif isinstance(o, list):
                  for v in o: marche(v, chemin)
          marche(d, [])
          cle = lambda a: hashlib.sha1(str(a.get("titre", "")).encode()).hexdigest()[:12]
          ancien = open("/tmp/ancien.md", encoding="utf-8").read()
          m = re.search(r"<!-- vus:([A-Za-z0-9+/=]*) -->", ancien)
          premier = m is None
          vus = set(json.loads(base64.b64decode(m.group(1)).decode())) if m and m.group(1) else set()
          neuves = [a for a in alertes if (a.get("nouveau") if premier else cle(a) not in vus)]
          tous = sorted(vus | {cle(a) for a in alertes})
          L = [f"**{len(neuves)}** alerte(s) de grille nouvelle(s) sur {len(alertes)} en cours au tableau de bord.", ""]
          for a in neuves:
              g = f" ({a['gravite']})" if a.get("gravite") else ""
              L.append(f"- [ ] **{a.get('titre','')}**{g}")
              if a.get("detail"): L.append(f"  {str(a['detail'])[:400]}")
          L += ["", "Pour fermer une alerte déjà traitée : exceptions.json du tableau de bord.",
                "", "<!-- vus:" + base64.b64encode(json.dumps(tous).encode()).decode() + " -->"]
          open("/tmp/tb.md", "w", encoding="utf-8").write("\n".join(L))
          env = open(os.environ["GITHUB_ENV"], "a")
          if neuves:
              env.write("ACTION=1\n")
          elif premier and ancien.strip():
              # Ancien ticket (d'avant le tableau de bord) sans mémoire : on y
              # range la liste des alertes vues, puis on le ferme (étape ticket).
              env.write("MIGRER=1\n")
          print(len(alertes), "alertes grilles,", len(neuves), "nouvelles")
          PY
          grep -v "^<!-- vus:" /tmp/tb.md >> $GITHUB_STEP_SUMMARY

      # Le test 2.1 du cahier de recette demandait un « curl » depuis un
      # terminal, impossible sur téléphone. Il est fait ici.
      - name: 2.1 — MonLegiTexte n'est pas indexable
        continue-on-error: true
        run: |
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "## 2.1 — MonLegiTexte hors index" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          URL="https://monlegitexte.heuressupfrance.workers.dev/"
          H=$(curl -sI "$URL" | tr -d '\r')
          if echo "$H" | grep -qi "x-robots-tag:.*noindex"; then
            echo "- En-tête \`x-robots-tag: noindex\` : **présent** ✓" >> $GITHUB_STEP_SUMMARY
          else
            echo "- En-tête \`x-robots-tag: noindex\` : **ABSENT** ✗ — le worker n'est pas déployé" >> $GITHUB_STEP_SUMMARY
          fi
          R=$(curl -s -o /dev/null -w "%{http_code}" "${URL}robots.txt")
          if [ "$R" = "200" ]; then
            echo "- \`/robots.txt\` répond 200 ✓" >> $GITHUB_STEP_SUMMARY
          else
            echo "- \`/robots.txt\` répond $R ✗" >> $GITHUB_STEP_SUMMARY
          fi

      # Ne s'ouvre que s'il y a des alertes de grille nouvelles au tableau de
      # bord (étape 1.6). Premier run après le passage au tableau de bord :
      # l'ancien ticket garde la mémoire des alertes vues et se ferme.
      # Sans ceci, un run planifié qui trouve une grille périmée passerait
      # inaperçu : GitHub ne notifie que les échecs, pas les succès. Le ticket
      # déclenche une notification sur téléphone, et sert d'aide-mémoire.
      - name: Signaler par un ticket si la veille a trouvé quelque chose
        if: env.ACTION == '1' || env.MIGRER == '1'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          CORPS=$(cat /tmp/tb.md)
          if [ "$ACTION" = "1" ]; then
            # Alertes nouvelles → NOUVEAU ticket : seule la création d'un ticket
            # envoie une notification (modifier un ticket existant n'en envoie pas).
            # Les tickets précédents restent ouverts tant qu'ils ne sont pas traités.
            gh label create veille-grilles --description "Grilles à rafraîchir" \
              --color FBCA04 2>/dev/null || true
            gh issue create --title "Veille des grilles — $(date +%d/%m/%Y)" \
              --body "$CORPS" --label veille-grilles
            echo "Ticket ouvert (notification envoyée)." >> $GITHUB_STEP_SUMMARY
          else
            # Une seule fois : l'ancien ticket (veille par dates) reçoit la mémoire
            # des alertes déjà vues, puis il est fermé. Plus de bruit ensuite.
            N=$(gh issue list --label veille-grilles --state all --limit 1 \
                  --json number --jq '.[0].number')
            gh issue edit "$N" --title "Veille des grilles — suivie par le tableau de bord" --body "$CORPS"
            gh issue close "$N" --reason "not planned" 2>/dev/null || gh issue close "$N"
            echo "Ancien ticket #$N converti au suivi par le tableau de bord, puis fermé." >> $GITHUB_STEP_SUMMARY
          fi

      - name: Rapports téléchargeables
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rapports-verification
          path: /tmp/*.md
          if-no-files-found: ignore
